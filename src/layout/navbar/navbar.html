<header class="navbar">
  <div class="navbar-inner container">
    <a routerLink="/" class="brand" (click)="closeMenu()" aria-label="TrackSetu home">
      <img
        src="/images/TrackSetuLogo.jpg"
        alt="TrackSetu"
        class="brand-logo"
      />
      <span class="brand-name">TrackSetu</span>
    </a>

    <nav class="nav-links" [class.open]="menuOpen()" aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/features" routerLinkActive="active" (click)="closeMenu()">Features</a>

      <div
        class="nav-dropdown"
        [class.open]="industriesOpen()"
        (mouseenter)="openIndustries()"
        (mouseleave)="scheduleCloseDropdowns()"
      >
        <button
          type="button"
          class="nav-dropdown-trigger"
          (click)="toggleIndustries()"
          [attr.aria-expanded]="industriesOpen()"
          aria-haspopup="true"
        >
          <span>Industries</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-chevron">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>

        <div class="nav-dropdown-menu">
          <a
            *ngFor="let industry of industries"
            [routerLink]="['/industries', industry.slug]"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            <img [src]="industry.image" [alt]="''" class="nav-dropdown-thumb" />
            <span>{{ industry.label }}</span>
          </a>
        </div>
      </div>

      <div
        class="nav-dropdown"
        [class.open]="resourcesOpen()"
        (mouseenter)="openResources()"
        (mouseleave)="scheduleCloseDropdowns()"
      >
        <button
          type="button"
          class="nav-dropdown-trigger"
          (click)="toggleResources()"
          [attr.aria-expanded]="resourcesOpen()"
          aria-haspopup="true"
        >
          <span>Resources</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-dropdown-chevron">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </button>

        <div class="nav-dropdown-menu nav-dropdown-menu-compact">
          <a
            *ngFor="let resource of resources"
            [routerLink]="resource.routerLink"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            <span class="nav-dropdown-icon" [ngSwitch]="resource.icon">
              <svg *ngSwitchCase="'workflow'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="3"></circle>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="12" r="3"></circle>
                <path d="M9 6h3a4 4 0 0 1 4 4"></path>
                <path d="M9 18h3a4 4 0 0 0 4-4"></path>
              </svg>
              <svg *ngSwitchCase="'help'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-1.5 2-2.5 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <svg *ngSwitchCase="'file'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <line x1="10" y1="9" x2="8" y2="9"></line>
              </svg>
              <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </span>
            <span>{{ resource.label }}</span>
          </a>
        </div>
      </div>

      <a routerLink="/pricing" routerLinkActive="active" (click)="closeMenu()">Pricing</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>

      <app-button
        class="mobile-cta"
        variant="secondary"
        size="md"
        routerLink="/book-a-demo"
        (click)="closeMenu()"
      >
        Book a Demo
      </app-button>
    </nav>

    <div class="navbar-actions">
      <app-button
        class="desktop-cta"
        variant="secondary"
        size="md"
        routerLink="/book-a-demo"
      >
        Book a Demo
      </app-button>

      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-navigation"
        aria-label="Toggle navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
