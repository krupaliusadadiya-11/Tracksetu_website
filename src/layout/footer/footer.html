<footer class="footer">
  <div class="footer-inner container" appReveal>
    <div class="footer-brand">
      <a routerLink="/" class="brand" aria-label="TrackSetu home">
        <span class="brand-mark">T</span>
        <span class="brand-name">TrackSetu</span>
      </a>
      <p class="tagline">One connected system to run your business better.</p>
    </div>

    <nav class="footer-links" aria-label="Footer navigation">
      <span class="footer-links-title">Company</span>
      <a routerLink="/">Home</a>
      <a routerLink="/features">Features</a>
      <a routerLink="/pricing">Pricing</a>
      <a routerLink="/contact">Contact</a>
      <a routerLink="/book-a-demo">Book a Demo</a>
    </nav>

    <nav class="footer-links" aria-label="Industries">
      <span class="footer-links-title">Industries</span>
      <a *ngFor="let industry of industries" [routerLink]="['/industries', industry.slug]">
        {{ industry.label }}
      </a>
    </nav>

    <nav class="footer-links" aria-label="Resources">
      <span class="footer-links-title">Resources</span>
      <a *ngFor="let resource of resources" [routerLink]="resource.routerLink">
        {{ resource.label }}
      </a>
    </nav>
  </div>

  <div class="footer-bottom">
    <div class="container">
      <span>&copy; {{ year }} TrackSetu. All rights reserved.</span>
    </div>
  </div>
</footer>
