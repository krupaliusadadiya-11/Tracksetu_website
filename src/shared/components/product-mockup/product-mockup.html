<div class="mockup" [attr.aria-hidden]="true">

  <!-- Dashboard variant -->
  <div class="mockup-frame" *ngIf="variant === 'dashboard'">
    <div class="frame-bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="frame-title">TrackSetu &middot; Overview</span>
    </div>
    <div class="frame-body dashboard-body">
      <aside class="mini-nav">
        <span class="nav-dot active"></span>
        <span class="nav-dot"></span>
        <span class="nav-dot"></span>
        <span class="nav-dot"></span>
        <span class="nav-dot"></span>
      </aside>
      <div class="dashboard-main">
        <div class="stat-row">
          <div class="stat-card">
            <span class="stat-label">Today's Sales</span>
            <span class="stat-value">₹1,84,200</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Open Orders</span>
            <span class="stat-value">37</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Low Stock</span>
            <span class="stat-value accent">6</span>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-bars">
            <span style="height: 40%"></span>
            <span style="height: 65%"></span>
            <span style="height: 50%"></span>
            <span style="height: 80%"></span>
            <span style="height: 60%"></span>
            <span style="height: 95%"></span>
            <span style="height: 70%"></span>
          </div>
        </div>
        <div class="row-list">
          <div class="row-item">
            <span class="row-dot"></span>
            <span class="row-text"></span>
            <span class="row-tag">Delivered</span>
          </div>
          <div class="row-item">
            <span class="row-dot"></span>
            <span class="row-text"></span>
            <span class="row-tag pending">Pending</span>
          </div>
          <div class="row-item">
            <span class="row-dot"></span>
            <span class="row-text"></span>
            <span class="row-tag">Delivered</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quotation variant -->
  <div class="mockup-frame" *ngIf="variant === 'quotation'">
    <div class="frame-bar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="frame-title">New Quotation</span>
    </div>
    <div class="frame-body quotation-body">
      <div class="qr-block">
        <div class="qr-icon">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="qr-caption">Scan product QR</span>
      </div>
      <div class="line-items">
        <div class="line-item" *ngFor="let i of [1,2,3]">
          <span class="line-dot"></span>
          <span class="line-text"></span>
          <span class="line-amount"></span>
        </div>
      </div>
      <div class="quote-total">
        <span>Total</span>
        <strong>₹42,650</strong>
      </div>
      <div class="pdf-pill">Generate PDF &amp; Send</div>
    </div>
  </div>

  <!-- Locations variant -->
  <div class="mockup-frame locations-frame" *ngIf="variant === 'locations'">
    <div class="hub">TrackSetu</div>
    <div class="locations-grid">
      <div class="location-card">
        <span class="loc-icon"></span>
        <span class="loc-name">Shop A</span>
        <span class="loc-stock">Stock: 214</span>
      </div>
      <div class="location-card">
        <span class="loc-icon"></span>
        <span class="loc-name">Shop B</span>
        <span class="loc-stock">Stock: 168</span>
      </div>
      <div class="location-card">
        <span class="loc-icon"></span>
        <span class="loc-name">Godown 1</span>
        <span class="loc-stock">Stock: 960</span>
      </div>
      <div class="location-card">
        <span class="loc-icon"></span>
        <span class="loc-name">Godown 2</span>
        <span class="loc-stock">Stock: 512</span>
      </div>
    </div>
  </div>

</div>
