<section class="key-features">
  <div class="container">
    <app-section-heading
      appReveal
      heading="Everything Your Daily Business Operations Need"
    ></app-section-heading>

    <div class="feature-grid">
      <article class="feature-card" *ngFor="let feature of features; let i = index" appReveal [revealDelay]="(i % 4) * 70">
        <span class="feature-icon" [ngSwitch]="feature.icon">
          <svg *ngSwitchCase="'quotation'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="18" rx="2"></rect><path d="M8 8h4M8 12h4M8 16h2"></path><rect x="15" y="14" width="6" height="6" rx="1"></rect></svg>
          <svg *ngSwitchCase="'order'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l1 5H5l1-5z"></path><path d="M5 8h14l-1.2 10.2A2 2 0 0 1 15.8 20H8.2a2 2 0 0 1-2-1.8L5 8z"></path><path d="M9 12h6"></path></svg>
          <svg *ngSwitchCase="'purchase'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18"></path><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"></path><path d="M5 7l1 12.2A2 2 0 0 0 8 21h8a2 2 0 0 0 2-1.8L19 7"></path><path d="M9 11h6"></path></svg>
          <svg *ngSwitchCase="'stock'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>
          <svg *ngSwitchCase="'alert'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 2.7 17a1.8 1.8 0 0 0 1.5 2.7h15.6a1.8 1.8 0 0 0 1.5-2.7L13.7 3.9a1.8 1.8 0 0 0-3.4 0z"></path></svg>
          <svg *ngSwitchCase="'delivery'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="13" height="9" rx="1"></rect><path d="M15 11h4l3 3v3h-7z"></path><circle cx="7" cy="19" r="1.6"></circle><circle cx="18" cy="19" r="1.6"></circle></svg>
          <svg *ngSwitchCase="'payment'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path><path d="M6 15h4"></path></svg>
          <svg *ngSwitchCase="'reports'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M3 20h18"></path></svg>
        </span>
        <h4>{{ feature.title }}</h4>
        <p>{{ feature.description }}</p>
      </article>
    </div>
  </div>
</section>
