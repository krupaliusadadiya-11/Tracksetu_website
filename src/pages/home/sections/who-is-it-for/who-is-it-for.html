<section class="who-for">
  <div class="container">
    <app-section-heading
      appReveal
      eyebrow="Industries We Serve"
      heading="Built for Product-Focused Businesses"
      supporting="TrackSetu is designed to support a wide range of product-driven industries, helping you manage inventory, sales and operations with ease."
    ></app-section-heading>

    <div class="industry-grid">
      <article
        class="industry-card"
        *ngFor="let industry of industries; let i = index"
        appReveal
        [revealDelay]="i * 80"
      >
        <div class="industry-photo" [ngClass]="'photo-' + industry.icon">
          <img [src]="industry.image" [alt]="industry.name + ' showroom'" loading="lazy" />
        </div>

        <div class="industry-card-body">
          <span class="industry-icon" [ngClass]="'icon-' + industry.icon" [ngSwitch]="industry.icon">
            <svg *ngSwitchCase="'tiles'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>
            <svg *ngSwitchCase="'sanitary'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v4"></path><path d="M4 8h14a1 1 0 0 1 1 1c0 5-3.5 9-8 9s-8-4-8-9a1 1 0 0 1 1-1z"></path><path d="M9 21h4"></path></svg>
            <svg *ngSwitchCase="'hardware'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4l-2.7 2.7-2-2 2.7-2.7z"></path></svg>
            <svg *ngSwitchCase="'wholesale'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"></rect><path d="M8 7V5a4 4 0 0 1 8 0v2"></path></svg>
          </span>
          <h4>{{ industry.name }}</h4>
          <p>{{ industry.description }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
