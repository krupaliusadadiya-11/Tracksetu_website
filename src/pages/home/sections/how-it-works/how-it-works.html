
<section class="how-it-works">
  <div class="container">

    <app-section-heading
      appReveal
      heading="From Quotation to Delivery Everything Stays Connected"
    ></app-section-heading>

    <div class="workflow">

      <!-- Sticky visual area -->
      <div class="workflow-sticky">

        <!-- Background images -->
        <div
          class="workflow-background"
          [style.backgroundImage]="'url(' + activeStep.image + ')'"
        ></div>

        <!-- Readability overlay -->
        <div class="workflow-overlay"></div>

        <!-- Main content -->
        <div class="workflow-content">

          <div class="workflow-copy" appReveal>
            <span class="workflow-number">
              {{ activeStep.number }}
            </span>

            <h3>{{ activeStep.title }}</h3>

            <p>{{ activeStep.description }}</p>
          </div>

          <!-- Step navigation -->
          <nav class="workflow-navigation" aria-label="Workflow steps">
            <button
              type="button"
              *ngFor="let step of steps; let i = index"
              class="workflow-nav-item"
              [class.active]="i === activeIndex"
              (click)="setActiveStep(i)"
            >
              <span class="nav-number">{{ step.number }}</span>
              <span class="nav-title">{{ step.title }}</span>
            </button>
          </nav>

        </div>
      </div>

      <!-- Invisible scroll zones -->
      <div class="workflow-scroll-track" aria-hidden="true">
        <div
          class="workflow-scroll-step"
          *ngFor="let step of steps; let i = index"
          [attr.data-step]="i"
        ></div>
      </div>

    </div>

  </div>
</section>
