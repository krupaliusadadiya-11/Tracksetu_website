<section class="faq">
  <div class="container">
    <app-section-heading
      appReveal
      eyebrow="Got Questions?"
      heading="Frequently Asked Questions"
      supporting="Find quick answers to common questions about using TrackSetu."
    ></app-section-heading>

    <div class="faq-layout">
      <div class="faq-card" appReveal>
        <span class="faq-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-1.5 2-2.5 3"></path>
            <path d="M12 17h.01"></path>
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
        </span>

        <h3>Still have questions?</h3>
        <p class="faq-card-text">
          Can't find the answer you're looking for? Our team is ready to help you get the most out of TrackSetu.
        </p>

        <ul class="faq-highlights">
          <li *ngFor="let item of highlights">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"></path>
            </svg>
            <span>{{ item.title }}</span>
          </li>
        </ul>

        <app-button variant="secondary" size="md" routerLink="/book-a-demo">
          Book a Demo
        </app-button>
      </div>

      <div class="faq-list">
        <article
          class="faq-item"
          *ngFor="let item of faqs; let i = index"
          [class.open]="activeIndex === i"
          appReveal
          [revealDelay]="i * 50"
        >
          <button
            type="button"
            class="faq-question"
            (click)="toggle(i)"
            [attr.aria-expanded]="activeIndex === i"
            [attr.aria-controls]="'faq-answer-' + i"
          >
            <span class="faq-number">{{ i + 1 }}</span>
            <h3>{{ item.question }}</h3>
            <svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>

          <div class="faq-answer" [id]="'faq-answer-' + i">
            <p>{{ item.answer }}</p>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
