<section class="final-cta">
  <div class="container final-cta-inner" appReveal>
    <span class="eyebrow">{{ eyebrow }}</span>
    <h2 class="reveal-heading-mask"><span class="reveal-heading-line">{{ heading }}</span></h2>
    <p class="supporting">
      {{ description }}
    </p>
    <div class="final-cta-actions">
      <app-button variant="primary" size="lg" [routerLink]="primaryLink" [fragment]="primaryFragment">
        {{ primaryLabel }}
      </app-button>
      <app-button
        *ngIf="secondaryLabel"
        variant="secondary"
        size="lg"
        [routerLink]="secondaryLink"
        [fragment]="secondaryFragment"
      >
        {{ secondaryLabel }}
      </app-button>
    </div>
  </div>
</section>
