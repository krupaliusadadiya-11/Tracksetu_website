<section class="client-env">
  <div class="container client-env-inner">
    <div class="client-env-visual" appReveal>
      <img
        class="env-image"
        src="images/industry/environment_img.jpg"
        alt="TrackSetu dedicated client environment with a private database and secure access"
        loading="lazy"
      />
    </div>

    <div class="client-env-content" appReveal [revealDelay]="120">
      <span class="eyebrow">Dedicated Environment</span>
      <h2 class="reveal-heading-mask"><span class="reveal-heading-line">Your Business Runs in Its Own Environment</span></h2>
      <p class="supporting">
        Each client gets their own software environment and database, with setup and access
        configured according to their business requirements.
      </p>

      <ul class="env-list">
        <li *ngFor="let point of points">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
          <span>{{ point.title }}</span>
        </li>
      </ul>
    </div>
  </div>
</section>
